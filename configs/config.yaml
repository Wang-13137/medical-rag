# 中文医疗知识库 RAG 系统 —— 全局配置
# 所有可调参数集中在此，代码内不硬编码魔法数字。
# 命令行 --data-dir / --index-path / --top-k 等可覆盖此处的值。

project:
  name: medical-rag
  # 阶段标识：W1 = 解析 / 切片 / 向量化 / FAISS 检索基线
  stage: W1

paths:
  # 清洗后的语料目录（scripts/clean_corpus.py 产出），建索引与检索都读这里
  data_dir: data/clean
  # 清洗前的原始语料，保留用于回溯与重新清洗
  raw_data_dir: data/raw
  # 原始采集物（PDF/HTML）归档
  original_dir: data/source_original
  # 冒烟测试样本文档目录
  smoke_data_dir: data/smoke
  # 正式索引：由 data/clean（16 份真实中文临床指南）建得，6625 条，见 README 第十节
  index_path: data/index/faiss_clean_base.index
  # 与索引配套的切片元数据（用于引用溯源）
  meta_path: data/index/chunks_clean_base.json

chunking:
  # 单个切片的最大字符数
  # 300/60 是 scripts/eval_chunk_params.py + eval_answer_recall.py 实测出来的最优组合
  # （等上下文预算下关键串全中率最高），详见 README 第九节
  chunk_size: 300
  # 相邻切片重叠的字符数（必须小于 chunk_size）
  chunk_overlap: 60
  # 低于该字符数的尾部落料会被并入上一个切片
  min_tail_chars: 30
  # 命中这些规则的行被识别为小标题行
  heading_max_chars: 60
  # 是否把标题层级路径拼进切片正文（有利于检索召回）
  prepend_heading_path: true

embedding:
  model_name: BAAI/bge-small-zh-v1.5
  # cpu / cuda；本机无 GPU，固定 cpu
  device: cpu
  batch_size: 16
  # L2 归一化后，FAISS IndexFlatIP 的内积即余弦相似度
  normalize: true
  max_seq_length: 512
  # bge 官方推荐的检索侧指令前缀；文档侧不加前缀
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  # 可选：已下载到本地的模型快照目录，填写后完全离线加载
  local_model_dir: ""

retrieval:
  top_k: 5
  # 低于该分数的结果在打印时给出提示（不参与过滤，仅提示）
  score_floor: 0.3
  # W2：是否启用 BM25 + 向量的 RRF 混合检索
  # 实测在本语料上低于纯向量（关键串全中率 0.500 -> 0.400），默认关闭，保留该开关用于对照实验
  use_hybrid: false
  hybrid:
    # RRF 常数 k，越大越弱化头部名次的差距
    rrf_k: 60
    # 每路各取 max(top_k, 20) * multiplier 条候选参与融合
    candidate_multiplier: 4
    # BM25 分词结果缓存（ pickle ），换索引自动重建
    cache_path: data/index/bm25_main.pkl

rerank:
  # W2：cross-encoder 精排。实测能把答案关键串全中率从 0.500 提到 0.600（见 README 第十一节）
  enabled: true
  model_name: BAAI/bge-reranker-base
  local_model_dir: %USERPROFILE%/.cache/modelscope/models/BAAI--bge-reranker-base/snapshots/master
  device: cpu
  batch_size: 8
  max_length: 512
  # 第一阶段先召回多少条候选
  candidate_k: 20

generation:
  # W2 后半：答案合成。false 时使用离线替身 EchoGenerator（不联网，供测试与演示）
  enabled: true
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.0
  max_tokens: 800
  # 送进提示词的上下文预算：片段按召回顺序累加，超过预算即停
  budget_chars: 2400
  # 送进提示词的候选条数上限
  top_n: 8

runtime:
  # CPU 推理线程数，本机 12 核
  num_threads: 12
  show_progress_bar: true
